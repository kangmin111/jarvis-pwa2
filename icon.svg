<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0b2948" />
      <stop offset="100%" stop-color="#050a14" />
    </radialGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 배경 둥근 사각형 및 테두리 -->
  <rect width="512" height="512" rx="110" fill="url(#bgGlow)" />
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#00e5ff" stroke-width="4" opacity="0.45" />

  <!-- 바깥쪽 HUD 링 -->
  <circle cx="256" cy="256" r="205" fill="none" stroke="#00e5ff" stroke-width="6" stroke-dasharray="70 25 15 25" opacity="0.85" />
  
  <!-- 중간 코일 링 -->
  <circle cx="256" cy="256" r="165" fill="none" stroke="#00e5ff" stroke-width="12" stroke-dasharray="28 14" opacity="0.65" filter="url(#neonGlow)" />

  <!-- 중앙 텍스트 플레이트 (글자가 선명하게 보이도록 어두운 코어 배경) -->
  <circle cx="256" cy="256" r="132" fill="#050a14" fill-opacity="0.92" stroke="#00e5ff" stroke-width="5" filter="url(#neonGlow)" />

  <!-- 상단 타이틀: J.A.R.V.I.S. -->
  <text x="256" y="242" text-anchor="middle" fill="#e0f7ff" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" font-weight="900" font-size="46" letter-spacing="3" filter="url(#neonGlow)">J.A.R.V.I.S.</text>

  <!-- 중앙 네온 구분선 -->
  <line x1="160" y1="264" x2="352" y2="264" stroke="#00e5ff" stroke-width="2.5" opacity="0.8" />

  <!-- 하단 제작자 각인: MADE BY KANGMIN -->
  <text x="256" y="294" text-anchor="middle" fill="#00e5ff" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" font-weight="700" font-size="18" letter-spacing="2">MADE BY KANGMIN</text>
</svg>